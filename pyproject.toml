[project]
name = "consylr"
version = "0.0.0"
description = "Offline enterprise exception analyst — reconciliation of conflicting records with cited evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aheebwa Ramadhan", email = "hello@badrama.com" }]
dependencies = []

[project.optional-dependencies]
# `tokenizers` is here so the pinned template overhead can actually be
# re-measured. The check was unrunnable without it, which made the pin a number
# nobody could contradict — it skips wherever the frozen model is absent, and a
# skip is not a pass.
dev = ["pytest>=8", "mypy>=1.11", "tokenizers>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consylr"]

[tool.hatch.build.targets.wheel.force-include]
"consylr/py.typed" = "consylr/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["consylr", "tests"]
