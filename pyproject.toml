[project]
name = "consylr"
version = "0.0.0"
description = "Offline enterprise exception analyst — reconciliation of conflicting records with cited evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aheebwa Ramadhan", email = "hello@badrama.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consylr"]

[tool.hatch.build.targets.wheel.force-include]
"consylr/py.typed" = "consylr/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["consylr", "tests"]
