name: ci

# Runs the same commands CONTRIBUTING.md tells a human to run. If the two ever
# diverge, the documented one is correct and this file is the bug.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top level; a job that needs more declares it itself.
permissions:
  contents: read

# A superseded push has nothing left to prove, and a hung job should fail rather
# than occupy a runner until the platform reaps it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs. A tag is mutable, so pinning to
      # a tag is pinning to nothing. Dependabot rewrites the SHA and the comment
      # together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # `--locked`, not `--frozen`. Both install exactly what `uv.lock` records;
      # only `--locked` fails when the lock and the manifest disagree — `--frozen`
      # exits 0 and leaves the new dependency simply missing. Resolving afresh on
      # every run would let a transitive dependency change under a green build
      # with nothing in the diff to show it.
      - name: install
        run: uv sync --locked --extra dev

      - name: hook rules
        run: bash tests/hooks/run.sh

      - name: lint
        run: ruff check .

      - name: format
        run: ruff format --check .

      - name: types
        run: python -m mypy

      - name: tests
        run: python -m pytest
