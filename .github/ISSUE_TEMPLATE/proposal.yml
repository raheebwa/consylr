name: Proposal
description: Propose a change to scope, an interface, the evaluation protocol, or a decision already recorded.
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Anything that changes scope, an interface, the output schema, or how results are
        produced and reported is a **design change**. Design changes are written down as
        an RFC in `docs/rfcs/` before anything is built, so the reasoning and the rejected
        alternatives survive alongside the implementation.

        This issue is where a proposal is discussed and shaped. Open it first; the RFC
        follows once the shape is agreed.

        Scope is set by `docs/prd/prd.md` and `README.md` §Scope discipline. Brute-force
        search over millions of rows, maintaining a general ledger, fraud attribution, and
        generation as the authority for arithmetic are out of scope **by decision, not by
        omission** — a proposal to add one has to overturn the decision, not just ask.

  - type: dropdown
    id: kind
    attributes:
      label: What does this change touch
      options:
        - Scope — what the product does or refuses to do
        - The output schema or evidence-reference format
        - The evaluation protocol or the sealed test set
        - Model choice, quantisation, or the resource budget
        - The command-line surface
        - A decision already recorded in docs/adrs/
        - Documentation only
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What currently goes wrong, or what cannot be expressed. Describe the situation,
        not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you want to change, and what the behaviour would be afterwards.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Other ways of solving the same problem, and why each is worse on its merits. An
        RFC is expected to carry this section, so it starts here.
    validations:
      required: true

  - type: textarea
    id: records
    attributes:
      label: Related records
      description: >-
        Which ADRs in `docs/adrs/` or RFCs in `docs/rfcs/` this would implement, amend, or
        contradict. Write `none` if it touches none of them.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Cost
      description: >-
        What this makes harder, and what it forecloses. A proposal listing only benefits
        is an advertisement. If it spends memory or throughput, say how much — both are
        scored, and the resource budget is fixed.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and RFCs, and this is not already proposed.
          required: true
        - label: I have read the scope discipline in `README.md` and this is not ruled out there.
          required: true
